<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="The six principles of the Orca workflow." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="1" y="1" width="898" height="488" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1e293b">
<text x="450" y="50" font-size="24" font-weight="700" text-anchor="middle">The six principles</text>
<rect x="40" y="80" width="260" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="40" y="80" width="260" height="8" rx="4" fill="#7c3aed"/>
<circle cx="74" cy="124" r="18" fill="#7c3aed"/>
<text x="74" y="130" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="60" y="172" font-size="17" font-weight="700">One outcome</text>
<text x="60" y="193" font-size="17" font-weight="700">per spec</text>
<text x="60" y="222" font-size="13.5" fill="#475569">Small tasks finish more often</text>
<text x="60" y="240" font-size="13.5" fill="#475569">and are easier to verify.</text>
<rect x="320" y="80" width="260" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="320" y="80" width="260" height="8" rx="4" fill="#0d9488"/>
<circle cx="354" cy="124" r="18" fill="#0d9488"/>
<text x="354" y="130" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="340" y="172" font-size="17" font-weight="700">Specs carry</text>
<text x="340" y="193" font-size="17" font-weight="700">the facts</text>
<text x="340" y="222" font-size="13.5" fill="#475569">Names, constraints, decisions:</text>
<text x="340" y="240" font-size="13.5" fill="#475569">no hunting, no guessing.</text>
<rect x="600" y="80" width="260" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="600" y="80" width="260" height="8" rx="4" fill="#d97706"/>
<circle cx="634" cy="124" r="18" fill="#d97706"/>
<text x="634" y="130" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="620" y="172" font-size="17" font-weight="700">Tests first,</text>
<text x="620" y="193" font-size="17" font-weight="700">prove they can fail</text>
<text x="620" y="222" font-size="13.5" fill="#475569">Break the code once to</text>
<text x="620" y="240" font-size="13.5" fill="#475569">confirm the test notices.</text>
<rect x="40" y="280" width="260" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="40" y="280" width="260" height="8" rx="4" fill="#2563eb"/>
<circle cx="74" cy="324" r="18" fill="#2563eb"/>
<text x="74" y="330" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="60" y="372" font-size="17" font-weight="700">Define done</text>
<text x="60" y="393" font-size="17" font-weight="700">mechanically</text>
<text x="60" y="422" font-size="13.5" fill="#475569">A checklist anyone can</text>
<text x="60" y="440" font-size="13.5" fill="#475569">verify, not a feeling.</text>
<rect x="320" y="280" width="260" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="320" y="280" width="260" height="8" rx="4" fill="#db2777"/>
<circle cx="354" cy="324" r="18" fill="#db2777"/>
<text x="354" y="330" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="340" y="372" font-size="17" font-weight="700">Never let the builder</text>
<text x="340" y="393" font-size="17" font-weight="700">grade itself</text>
<text x="340" y="422" font-size="13.5" fill="#475569">A fresh reviewer sees the</text>
<text x="340" y="440" font-size="13.5" fill="#475569">result, not the summary.</text>
<rect x="600" y="280" width="260" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="600" y="280" width="260" height="8" rx="4" fill="#16a34a"/>
<circle cx="634" cy="324" r="18" fill="#16a34a"/>
<text x="634" y="330" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="620" y="372" font-size="17" font-weight="700">Fresh session per task,</text>
<text x="620" y="393" font-size="17" font-weight="700">state in files</text>
<text x="620" y="422" font-size="13.5" fill="#475569">Any session can restart</text>
<text x="620" y="440" font-size="13.5" fill="#475569">without losing progress.</text>
</g></svg>
