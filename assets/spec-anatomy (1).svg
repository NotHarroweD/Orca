<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="The parts of a spec and what each is for." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="1" y="1" width="898" height="578" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1e293b">
<text x="450" y="48" font-size="24" font-weight="700" text-anchor="middle">Anatomy of a spec</text>
<text x="450" y="72" font-size="14" fill="#475569" text-anchor="middle">Everything a cheap model needs to do one job correctly, and nothing more</text>
<rect x="50" y="100" width="190" height="40" rx="10" fill="#7c3aed"/>
<text x="145" y="126" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Why</text>
<rect x="250" y="100" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="126" font-size="15.5" fill="#1e293b">Lets the implementer make sensible small calls</text>
<rect x="50" y="152" width="190" height="40" rx="10" fill="#0d9488"/>
<text x="145" y="178" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Allowed files</text>
<rect x="250" y="152" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="178" font-size="15.5" fill="#1e293b">The only files it may touch</text>
<rect x="50" y="204" width="190" height="40" rx="10" fill="#d97706"/>
<text x="145" y="230" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Task</text>
<rect x="250" y="204" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="230" font-size="15.5" fill="#1e293b">Exactly what to build; every ambiguity closed</text>
<rect x="50" y="256" width="190" height="40" rx="10" fill="#2563eb"/>
<text x="145" y="282" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Facts</text>
<rect x="250" y="256" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="282" font-size="15.5" fill="#1e293b">Names, signatures, decisions: no hunting</text>
<rect x="50" y="308" width="190" height="40" rx="10" fill="#db2777"/>
<text x="145" y="334" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Tests + breaks</text>
<rect x="250" y="308" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="334" font-size="15.5" fill="#1e293b">Each test paired with a break that must fail it</text>
<rect x="50" y="360" width="190" height="40" rx="10" fill="#16a34a"/>
<text x="145" y="386" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Checks</text>
<rect x="250" y="360" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="386" font-size="15.5" fill="#1e293b">The exact command(s) to run</text>
<rect x="50" y="412" width="190" height="40" rx="10" fill="#7c3aed"/>
<text x="145" y="438" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Commit</text>
<rect x="250" y="412" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="438" font-size="15.5" fill="#1e293b">The exact message to use</text>
<rect x="50" y="464" width="190" height="40" rx="10" fill="#0d9488"/>
<text x="145" y="490" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Report</text>
<rect x="250" y="464" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="490" font-size="15.5" fill="#1e293b">Where the implementer saves its report</text>
<rect x="50" y="516" width="190" height="40" rx="10" fill="#475569"/>
<text x="145" y="542" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Out of scope</text>
<rect x="250" y="516" width="600" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="270" y="542" font-size="15.5" fill="#1e293b">What not to do</text>
</g></svg>
