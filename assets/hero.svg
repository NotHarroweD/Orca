<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="The Orca loop: orchestrator writes a spec, implementer builds it, reviewer audits it, findings return to the orchestrator." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="898" height="398" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#1e293b">
<text x="450" y="55" font-size="23" font-weight="700">Plan with the best. Build with the cheapest. Review with fresh eyes.</text>
<rect x="60" y="110" width="220" height="130" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="170" y="158" font-size="23" font-weight="700">Orchestrator</text>
<text x="170" y="187" font-size="15" fill="#475569">Plans and writes specs</text>
<text x="170" y="212" font-size="13" font-style="italic" fill="#475569">most capable tier</text>
<rect x="340" y="110" width="220" height="130" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
<text x="450" y="158" font-size="23" font-weight="700">Implementer</text>
<text x="450" y="187" font-size="15" fill="#475569">Builds exactly one spec</text>
<text x="450" y="212" font-size="13" font-style="italic" fill="#475569">cheapest tier that works</text>
<rect x="620" y="110" width="220" height="130" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="730" y="158" font-size="23" font-weight="700">Reviewer</text>
<text x="730" y="187" font-size="15" fill="#475569">Audits against the spec</text>
<text x="730" y="212" font-size="13" font-style="italic" fill="#475569">fresh session, finds problems</text>
<line x1="284" y1="175" x2="336" y2="175" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="310" y="162" font-size="13" fill="#475569">spec</text>
<line x1="564" y1="175" x2="616" y2="175" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="590" y="162" font-size="13" fill="#475569">result</text>
<path d="M730 244 V300 H170 V248" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="450" y="324" font-size="14" fill="#475569">findings: revise the spec, or move to the next task</text>
<text x="450" y="372" font-size="15" font-weight="600">A fresh session per task. State lives in files, not in chat.</text>
</g></svg>
